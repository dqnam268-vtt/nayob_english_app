<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Class App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-container">
        
        <div id="login-section" class="login-container">
            <h2 style="color: #0c4a6e; margin-bottom: 20px;">ĐĂNG NHẬP</h2>
            
            <input type="text" id="username" placeholder="Tên đăng nhập (VD: namy_student)" class="login-input">
            <input type="password" id="password" placeholder="Mật khẩu (VD: 123456)" class="login-input">
            
            <button id="login-btn" class="login-btn">Vào Học</button>
            <p id="login-error" style="color: red; display: none; margin-top: 15px; font-size: 14px; text-align: center;"></p>
        </div>

        <div id="main-app" style="display: none;">
            
            <header class="app-header">
                <h1>ENGLISH CLASS</h1>
            </header>

            <main class="course-content">
                <div class="week-section">
                    <div class="week-title">WEEK 1</div>
                    <button class="exercise-btn">EXERCISE 1</button>
                    <button class="exercise-btn">EXERCISE 2</button>
                </div>

                <div class="week-section">
                    <div class="week-title">WEEK 2</div>
                    <button class="exercise-btn">EXERCISE 1</button>
                    <button class="exercise-btn">EXERCISE 2</button>
                    <button class="exercise-btn">EXERCISE 3</button>
                </div>
            </main>

            <div class="floating-feedback">
                <button id="feedback-btn">✉️</button>
            </div>

        </div> <footer class="app-footer">
            <p>Made by NamY</p>
        </footer>

    </div>

    <script src="app.js"></script>
</body>
</html>
